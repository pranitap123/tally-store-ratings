name: tally

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tally_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-tally}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-tally}:${POSTGRES_PASSWORD:-tally_dev_pw}@db:5432/${POSTGRES_DB:-tally}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@tally.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}

  web:
    build: ./frontend
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
