<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tally — read honest ratings for local stores, and leave your own." />
    <meta name="theme-color" content="#f5f0e8" />
    <title>Tally · honest ratings for local stores</title>
    <script>
      // set theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('tally-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
